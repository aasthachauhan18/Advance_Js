// 15. Debug Async Validation

async function validateAsync(username) {
  return new Promise((resolve) => {
    setTimeout(() => {
      resolve(username.length >= 4); 
    }, 500);
  });
}

async function submitForm(username) {
  const isValid = await validateAsync(username);

  if (!isValid) {
    return;
  }

  await fetch("https://jsonplaceholder.typicode.com/users");
}
