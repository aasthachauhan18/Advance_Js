        // Run 3 async tasks one after another.

        function fetchData(msg,delay) {
            return new Promise((resolve,reject) =>{
                setTimeout(() => resolve(msg),delay)
            });
        }

        async function getData() {
            const a = await fetchData("Task1",1000);
            const b= await fetchData("Task2",1000);
            const c = await fetchData("Task3",1000);
