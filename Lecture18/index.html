        // Task 7: Base Utility Class
        class Logger{
            log(message){
                 const time = new Date().toLocaleTimeString();
        console.log(`[${time}] ${message}`);
            }
        }


        class UserService extends Logger{
            createUser(username){

            }
        }

            }
        }
