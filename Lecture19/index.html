// Task 4: Understand done Flag

const numbers = {
  [Symbol.iterator]() {
    let current = 1;
    return {
      next() {
        const result =
          current <= 5
            ? { value: current++, done: false }
            : { value: undefined, done: true };

        console.log(result);
        return result;
      }
    };
  }
};

for (const n of numbers) {}

// Task 6: Beginner Debugging (Make Object Iterable)

const obj = {
  a: 1,
  b: 2,
  [Symbol.iterator]() {
    const values = Object.values(this);
    let index = 0;

    return {
      next() {
        if (index < values.length) {
          return { value: values[index++], done: false };
        }
        return { done: true };
      }
    };
  }
};

for (const v of obj) {
  console.log(v);
}


// Task 7: Range Iterable (Reusable)

function range(start, end) {
  return {
    [Symbol.iterator]() {
      let current = start;
      return {
        next() {
          if (current <= end) {
            return { value: current++, done: false };
          }
          return { done: true };
        }
      };
    }
  };
}

console.log([...range(1, 5)]); 

// Task 8: Generator-Based Range

function* range(start, end) {
  for (let i = start; i <= end; i++) {
    yield i;
  }
}
